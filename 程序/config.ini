; 智慧图书馆数字资源平台 - 运行配置（三台虚拟机版本）
; 数据库跑在 VMware 的三台克隆机上，地址 192.168.121.134/135/136。
; 单机形态对应统一口径的 27016 实例，副本集与分片对应本项目扩展的集群。
; 可通过环境变量覆盖: LIB_PROFILE / LIB_URI / LIB_DB / LIB_CONFIG

[app]
; 默认使用的部署形态: standalone | replset | shard
default_profile = standalone
db_name = library
page_size = 10

[standalone]
; 统一口径的 27016 单机实例，账号 itcastAdmin/123456 为管理员
uri = mongodb://192.168.121.134:27016
admin_uri = mongodb://itcastAdmin:123456@192.168.121.134:27016/?authSource=admin
; 业务账号（读写 / 只读），用于演示权限控制
auth_uri = mongodb://lib_editor:lib2026pwd@192.168.121.134:27016/library?authSource=library
readonly_uri = mongodb://lib_reader:lib2026pwd@192.168.121.134:27016/library?authSource=library

[replset]
uri = mongodb://192.168.121.134:27018,192.168.121.135:27018,192.168.121.136:27018/?replicaSet=rs_lib
admin_uri = mongodb://platform_admin:Admin2026pwd@192.168.121.134:27018/?replicaSet=rs_lib&authSource=admin
auth_uri = mongodb://lib_editor:lib2026pwd@192.168.121.134:27018,192.168.121.135:27018,192.168.121.136:27018/library?replicaSet=rs_lib&authSource=library
readonly_uri = mongodb://lib_reader:lib2026pwd@192.168.121.134:27018,192.168.121.135:27018,192.168.121.136:27018/library?replicaSet=rs_lib&authSource=library
read_preference = secondaryPreferred

[shard]
uri = mongodb://192.168.121.134:27022
admin_uri = mongodb://platform_admin:Admin2026pwd@192.168.121.134:27022/?authSource=admin
auth_uri = mongodb://lib_editor:lib2026pwd@192.168.121.134:27022/library?authSource=library
readonly_uri = mongodb://lib_reader:lib2026pwd@192.168.121.134:27022/library?authSource=library

[paths]
; 相对本目录解析，数据文件沿用仓库里的 数据/ 目录
data_dir = ../数据
gridfs_dir = ../数据/gridfs
download_dir = downloads
export_dir = exports
backup_dir = backup
