systemLog:
  destination: file
  path: /data/lib/log/rs2.log
  logAppend: true
storage:
  dbPath: /data/lib/rs2
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.8
net:
  port: 27018
  bindIp: 0.0.0.0
security:
  keyFile: /data/lib/key/mongo.key
  authorization: enabled
replication:
  replSetName: rs_lib
processManagement:
  fork: true
  timeZoneInfo: /usr/share/zoneinfo
