systemLog:
  destination: file
  path: /data/lib/log/standalone.log
  logAppend: true
storage:
  dbPath: /data/lib/standalone
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.8
net:
  port: 27017
  bindIp: 0.0.0.0
security:
  authorization: enabled
processManagement:
  fork: true
  timeZoneInfo: /usr/share/zoneinfo
