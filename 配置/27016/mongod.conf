systemLog:
  destination: file
  path: /export/servers/standalone/log/mongodb.log
  logAppend: true
processManagement:
  fork: true
net:
  port: 27016
  bindIp: nosql01
storage:
  dbPath: /export/servers/standalone/dbs
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.25
security:
  authorization: enabled
