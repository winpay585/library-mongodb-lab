systemLog:
  destination: file
  path: /data/lib/log/cfg3.log
  logAppend: true
storage:
  dbPath: /data/lib/cfg3
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.25
net:
  port: 27019
  bindIp: 0.0.0.0
security:
  keyFile: /data/lib/key/mongo.key
  authorization: enabled
replication:
  replSetName: cfgrs
sharding:
  clusterRole: configsvr
processManagement:
  fork: true
  timeZoneInfo: /usr/share/zoneinfo
