systemLog:
  destination: file
  path: /data/lib/log/shard2.log
  logAppend: true
storage:
  dbPath: /data/lib/shard2
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.25
net:
  port: 27021
  bindIp: 0.0.0.0
security:
  keyFile: /data/lib/key/mongo.key
  authorization: enabled
replication:
  replSetName: shard2rs
sharding:
  clusterRole: shardsvr
processManagement:
  fork: true
  timeZoneInfo: /usr/share/zoneinfo
